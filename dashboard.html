<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Dashboard — Artt by Noor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">artt <span>by noor</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Art Gallery</a></li>
    <li><a href="booking.html">Book Mehndi</a></li>
  </ul>
</nav>

<!-- Passcode lock -->
<div class="dash-lock" id="lockScreen">
  <h1>Noor's Dashboard</h1>
  <p>Enter your passcode to upload and manage gallery pictures.</p>
  <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off">
  <button onclick="tryUnlock()">Unlock</button>
  <div class="err" id="lockErr"></div>
</div>

<!-- Dashboard content (shown after unlock) -->
<div class="dash-page" id="dashContent" style="display:none;">
  <div class="dash-header">
    <div class="section-label">Private</div>
    <h1>Gallery <em>Dashboard</em></h1>
    <p>Upload new pictures to any category — they'll appear on the matching gallery page right away.</p>
  </div>

  <div class="dash-form">
    <div class="full">
      <label>Category</label>
      <select id="uploadCategory">
        <option value="crochet">Crochet</option>
        <option value="painting">Painting</option>
        <option value="crafts">Crafts</option>
        <option value="mehndi">Mehndi</option>
        <option value="jewelry">Handmade Jewelery</option>
        <option value="charms">Charms</option>
      </select>
    </div>
    <div class="full">
      <label>Title / Caption</label>
      <input type="text" id="uploadTitle" placeholder="e.g. Bridal Arabic Design">
    </div>
    <div class="full">
      <label>Picture</label>
      <input type="file" id="uploadFile" accept="image/*">
      <img id="uploadPreview" class="dash-preview">
    </div>
    <div class="full">
      <button onclick="uploadImage()" id="uploadBtn">Upload Picture</button>
    </div>
  </div>

  <div id="galleryManager"></div>
</div>

<div class="notify" id="notify"></div>
<script src="js/site.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
